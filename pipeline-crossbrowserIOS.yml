trigger:
  branches:
    exclude:
      - '*'

parameters:
  - name: branchName
    type: string
    default: 'refs/heads/dev'
  - name: Environment
    type: string
    default: 'tst'
  - name: ApiEndpoint
    type: string
    default: 'tst'
  - name: SeleniumGrid
    type: string
    default: 'https://hub.browserstack.com/wd/hub/'
  - name: DeviceName
    type: string
    default: 'Windows'
  - name: BSOSVersion
    type: string
    default: '11'
  - name: BSBrowserVersion
    type: string
    default: 'latest'
  - name: Target
    type: string
    default: 'Edge'
  
resources:
  repositories:
    - repository: clientautomationreponew
      type: github
      name: DEFRA/nipts-pts-automation-tests
      ref: $(Build.SourceBranch)
      endpoint: DEFRA

stages:
  
  - stage: EnvironmentCheck
    displayName: EnvironmentCheck
    jobs:
    - template: run-test-template.yml
      parameters:
        jobName: EnvironmentCheck
        testStepTimeoutMinutes: 120
        envConfigParam: ${{ parameters.Environment}}
        apiEndPoint: ${{ parameters.ApiEndpoint}}
        branchName: ${{ parameters.branchName}}
        SeleniumGrid: ${{parameters.SeleniumGrid}}  
        TestDeviceName: ${{parameters.DeviceName}}
        OSVersionName: ${{parameters.BSOSVersion}}
        BrowserVersionName: ${{parameters.BSBrowserVersion}}
        dependsOn: ''
        targetBrowserName: ${{parameters.Target}}


  # Safari stages (iPad and iPhone 14) disabled: the native iOS Safari Save-Password/AutoFill
  # sheet swallows the Government Gateway credential submit, bouncing back to the B2C chooser
  # ("We can't sign you in"). Chrome on the same devices signs in fine, so Chrome is our iOS
  # coverage until a client-side dismiss for the Safari sheet is found.
  - stage: IOSIpad12ChromeRun
    displayName: IOSIpad12ChromeRun
    jobs:
    - template: run-test-template.yml
      parameters:
        jobName: IOSIpad12ChromeRun
        testStepTimeoutMinutes: 120
        envConfigParam: ${{ parameters.Environment}}
        apiEndPoint: ${{ parameters.ApiEndpoint}}
        branchName: ${{ parameters.branchName}}
        SeleniumGrid: ${{parameters.SeleniumGrid}}  
        TestDeviceName: 'iPad Pro 12.9 2022'
        OSVersionName: '18'
        BrowserVersionName: ''
        dependsOn: ''
        targetBrowserName: 'Chrome'

  # - stage: IOSIpad12SafariRun
  #   displayName: IOSIpad12SafariRun
  #   jobs:
  #   - template: run-test-template.yml
  #     parameters:
  #       jobName: IOSIpad12SafariRun
  #       testStepTimeoutMinutes: 120
  #       envConfigParam: ${{ parameters.Environment}}
  #       apiEndPoint: ${{ parameters.ApiEndpoint}}
  #       branchName: ${{ parameters.branchName}}
  #       SeleniumGrid: ${{parameters.SeleniumGrid}}  
  #       TestDeviceName: 'iPad Pro 12.9 2022'
  #       OSVersionName: '18'
  #       BrowserVersionName: ''
  #       dependsOn: ''
  #       targetBrowserName: 'safari'

  - stage: IOSIphone14ChromeRun
    displayName: IOSIphone14ChromeRun
    jobs:
    - template: run-test-template.yml
      parameters:
        jobName: IOSIphone14ChromeRun
        testStepTimeoutMinutes: 120
        envConfigParam: ${{ parameters.Environment}}
        apiEndPoint: ${{ parameters.ApiEndpoint}}
        branchName: ${{ parameters.branchName}}
        SeleniumGrid: ${{parameters.SeleniumGrid}}  
        TestDeviceName: 'iPhone 14'
        OSVersionName: '18'
        BrowserVersionName: ''
        dependsOn: ''
        targetBrowserName: 'Chrome'

  # Disabled: iPhone 14 Safari fails GG sign-in via the native Save-Password sheet (see note
  # above). iPhone 14 Chrome above is green and provides the iOS signal.

parameters:
  - name: jobName
    type: string
  - name: envConfigParam
    type: string
  - name: apiEndPoint
    type: string
  - name: branchName
    type: string
  - name: SeleniumGrid
    type: string
  - name: TestDeviceName
    type: string
  - name: OSVersionName
    type: string
  - name: BrowserVersionName
    type: string
  - name: dependsOn
    type: string
  - name: targetBrowserName
    type: string
  # Caps how many tests run in parallel within a single job. Each parallel test
  # opens its own BrowserStack session, so this directly bounds the job's session
  # demand. Overrides NumberOfTestWorkers in the artifact's runsettings at run time.
  # Keep the total across all concurrently-running jobs under the account's parallel
  # session limit (currently 13) to avoid "Remote WebDriver not been set properly".
  - name: maxParallelSessions
    type: number
    default: 2

jobs: 

- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.jobName }}
  timeoutInMinutes: 300

  pool:
    name: 'DEFRA-TRD'

  variables:
    - template: test-variables_CI.yml
      parameters:
        env: ${{parameters.envConfigParam}}
        jobNameParam: ${{parameters.jobName}}
        targetBrowser: ${{parameters.targetBrowserName}}
        TestDevice: ${{parameters.TestDeviceName}}
        OSVersion: ${{parameters.OSVersionName}}
        BrowserVersion: ${{parameters.BrowserVersionName}}

  steps:

    - powershell: |
        # Cross-pipeline serialize lock (YAML-only, no portal check required).
        #
        # All BrowserStack pipelines share one BrowserStack account, so only one run
        # should execute at a time. Each run tags itself with a shared build tag and
        # then waits until it is the OLDEST tagged run still in progress before doing
        # any work. Because Build.BuildId is a strict, monotonically increasing order,
        # exactly one run is the "lowest id" at any moment - it proceeds while every
        # newer run waits and re-polls. This gives sequential, in-queue-order execution
        # with no deadlock. A newer run can never overtake, because its id is higher.
        #
        # The lock is held for the WHOLE run: a lower-id run stays "in progress" until
        # it finishes, so higher-id runs keep waiting at this gate across both stages.
        #
        # Prerequisites (defaults are usually already in place):
        #   - The job can access the OAuth token ($(System.AccessToken)).
        #   - The build identity has "View builds" on the serialized pipelines, which
        #     must live in this same project ($(System.TeamProject)).
        $ErrorActionPreference = 'Stop'
        # Windows PowerShell 5.1 defaults to TLS 1.0/1.1, which modern HTTPS endpoints
        # (including Azure DevOps) reject at the handshake. Force TLS 1.2 first.
        [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
        $org     = "$(System.CollectionUri)"
        $project = "$(System.TeamProject)"
        $buildId = [int]"$(Build.BuildId)"
        $tag     = 'browserstack-serial'
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }

        # Opt this run into the shared lock so other pipelines can discover it.
        Write-Host "##vso[build.addbuildtag]$tag"

        # Jitter so runs that start together have time to publish their tag before the
        # first lock check, reducing the chance two runs both think they are oldest.
        Start-Sleep -Seconds (Get-Random -Minimum 5 -Maximum 20)

        $maxWaitMinutes = 180
        $deadline       = (Get-Date).AddMinutes($maxWaitMinutes)

        while ($true) {
          $uri = "$org$project/_apis/build/builds?statusFilter=inProgress&tagFilters=$tag&api-version=7.0"
          try {
            $resp = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          }
          catch {
            Write-Host "##vso[task.logissue type=warning]Could not query in-progress builds ($($_.Exception.Message)); proceeding without serialization."
            break
          }

          # Server-side tagFilters can be permissive, so confirm the tag client-side.
          $builds = @($resp.value | Where-Object { $_.tags -contains $tag })
          if ($builds.Count -eq 0) {
            Write-Host "No tagged in-progress builds found; proceeding."
            break
          }

          $minId = ($builds | Measure-Object -Property id -Minimum).Minimum
          if ($buildId -le $minId) {
            Write-Host "This run (build $buildId) holds the lock - it is the oldest of $($builds.Count) in-progress run(s). Proceeding."
            break
          }

          if ((Get-Date) -ge $deadline) {
            Write-Host "##vso[task.logissue type=warning]Waited $maxWaitMinutes min for the serialize lock (oldest id $minId, mine $buildId). Proceeding anyway."
            break
          }

          $ahead = @($builds | Where-Object { $_.id -lt $buildId }).Count
          $wait  = Get-Random -Minimum 20 -Maximum 40
          Write-Host "Waiting for $ahead earlier run(s) to finish (oldest id $minId, mine $buildId). Re-checking in $wait s..."
          Start-Sleep -Seconds $wait
        }
      displayName: 'Serialize pipeline runs (wait for earlier runs)'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - task: AzureKeyVault@2
      displayName: 'Get BrowserStack credentials and APIM subscription keys from Key Vault'
      inputs:
        # NOTE: confirm this is the correct service connection for the subscription
        # that hosts TSTTRDINFKV1001 (following the AZD-TRD-<ENV>1 naming convention).
        azureSubscription: 'AZD-TRD-TST1'
        KeyVaultName: 'TSTTRDINFKV1001'
        # PTS-CP-OCP-APIM-SUBSCRIPTION-KEY  -> checker API (ApiEndpoint5)
        # Pts-Apim-SubscriptionKey          -> all other APIs
        # Pts-B2C-Tenant-ClientSecret       -> backend (PTS tenant) bearer token audience
        # Nipts-Automations-Username/Password -> backend-enrolled test user for the API token login
        # PTS-CP-MAGIC-PASSWORD             -> shared sign-in password (TestConfiguration.EnvPassword)
        SecretsFilter: 'Nipts-BrowserStack-Username,Nipts-BrowserStack-Password,PTS-CP-OCP-APIM-SUBSCRIPTION-KEY,Pts-Apim-SubscriptionKey,Pts-B2C-Tenant-ClientSecret,Nipts-Automations-Username,Nipts-Automations-Password,PTS-CP-MAGIC-PASSWORD'
        RunAsPreJob: false

    - task: DownloadBuildArtifacts@0
      displayName: TestArtifact
      inputs:
        buildType: 'specific'
        project: '023a3c95-20fd-49b4-b068-4706843ba0d7'
        pipeline: '7383'
        buildVersionToDownload: 'latestFromBranch'
        branchName: ${{ parameters.branchName }}
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: CopyFiles@2
      displayName: 'Copy Test Artifacts'
      inputs:
        SourceFolder: '$(System.ArtifactsDirectory)/drop'
        TargetFolder: $(System.DefaultWorkingDirectory)
        OverWrite: true
        CleanTargetFolder: true
    
    - task: ExtractFiles@1
      inputs:
        archiveFilePatterns: '**/nipts-pts-automation-tests.zip'
        destinationFolder: '$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests'
        cleanDestinationFolder: false
        overwriteExistingFiles: true
    
    - task: replacetokens@3
      displayName: 'Inject BrowserStack credentials and APIM subscription keys from Key Vault'
      env:
        # Secret variables are not exposed to tasks as environment variables by
        # default, so map the Key Vault secrets explicitly for token replacement.
        BrowserStackUserName: $(Nipts-BrowserStack-Username)
        BrowserStackAccessKey: $(Nipts-BrowserStack-Password)
        PtsCpOcpApimSubscriptionKey: $(PTS-CP-OCP-APIM-SUBSCRIPTION-KEY)
        PtsApimSubscriptionKey: $(Pts-Apim-SubscriptionKey)
        B2CClientSecret: $(Pts-B2C-Tenant-ClientSecret)
        B2CBackendUsername: $(Nipts-Automations-Username)
        B2CBackendPassword: $(Nipts-Automations-Password)
        PtsCpMagicPassword: $(PTS-CP-MAGIC-PASSWORD)
      inputs:
        rootDirectory: '$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests'
        targetFiles: 'appsettings.json'
        encoding: auto
        writeBOM: true
        escapeType: json
        # warn rather than fail: mobile runs intentionally pass an empty BSBrowserVersion.
        # Once all artifacts are rebuilt with the updated appsettings.json (which no longer
        # contains non-secret tokens), only BrowserStackUserName and BrowserStackAccessKey
        # tokens will remain and both will always be present from Key Vault.
        actionOnMissing: warn
        keepToken: false
        tokenPrefix: '#{{'
        tokenSuffix: '}}'
        useLegacyPattern: false
        enableTelemetry: false

    - powershell: |
        # Inject CI-specific settings into appsettings.json.
        # appsettings.json holds local-runnable defaults; this step overrides only
        # what differs in CI without using tokens for non-secret values.
        # BrowserStack credentials are always written here so this step works
        # regardless of whether the downloaded artifact was built before or after
        # the token-placeholder approach was introduced.
        $filePath = "$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/appsettings.json"
        # The preceding replacetokens task writes a UTF-8 BOM (writeBOM: true).
        # Windows PowerShell 5.1 reads that BOM into the first line, which breaks
        # ConvertFrom-Json ("Invalid JSON primitive"). Read the whole file as raw
        # text and strip the BOM before parsing.
        $raw  = [System.IO.File]::ReadAllText($filePath)
        $raw  = $raw.TrimStart([char]0xFEFF)
        # Windows PowerShell 5.1's ConvertFrom-Json (JavaScriptSerializer) is
        # stricter than .NET's configuration JSON reader: it rejects trailing
        # commas that the test app itself tolerates (AddJsonFile allows them).
        # Strip any trailing comma before a closing } or ] so an artifact built
        # before the appsettings.json fix still parses here.
        $raw  = [regex]::Replace($raw, ',(\s*[}\]])', '$1')
        $json = $raw | ConvertFrom-Json

        $json.AppSettings.TestConfiguration.ComPortalUrl     = "https://$(Environment)-check-a-pet-from-gb-to-ni.azure.defra.cloud/"
        $json.AppSettings.TestConfiguration.AppPortalUrl     = "https://$(Environment)-take-your-pet-from-gb-to-ni.azure.defra.cloud/"
        $json.AppSettings.TestConfiguration.Headless         = $true
        $json.AppSettings.TestConfiguration.DeviceName       = "$(DeviceName)"
        $json.AppSettings.TestConfiguration.BSOSVersion      = "$(BSOSVersion)"
        $json.AppSettings.TestConfiguration.Build            = "$(Build)"
        $json.AppSettings.UiFrameworkConfiguration.SeleniumGrid = "$(SeleniumGrid)"
        $json.AppSettings.UiFrameworkConfiguration.Target    = "$(Target)"
        # BrowserStack credentials may be absent from the artifact's appsettings.json
        # (they are normally populated from Key Vault at runtime), so add/overwrite
        # the properties with Add-Member -Force rather than a plain assignment, which
        # throws if the property does not already exist.
        $bsConfig = $json.AppSettings.BrowserStackConfiguration
        $bsConfig | Add-Member -NotePropertyName CloudDeviceUserName -NotePropertyValue $env:BS_USERNAME -Force
        $bsConfig | Add-Member -NotePropertyName CloudDeviceUserKey  -NotePropertyValue $env:BS_ACCESSKEY -Force

        # EnvPassword (the shared sign-in "magic" password) is normally populated
        # from Key Vault at runtime via DefaultAzureCredential. That credential is
        # unavailable on self-hosted agents (no managed identity / az login), which
        # leaves EnvPassword null and makes SendKeys throw. Inject it here from the
        # Key Vault secret so the value is present regardless of the runtime path.
        $tstConfig = $json.AppSettings.TestConfiguration
        $tstConfig | Add-Member -NotePropertyName EnvPassword -NotePropertyValue $env:MAGIC_PASSWORD -Force

        # BSBrowserVersion is intentionally empty for mobile/Android runs.
        if (-not [string]::IsNullOrEmpty("$(BSBrowserVersion)")) {
          $json.AppSettings.TestConfiguration.BSBrowserVersion = "$(BSBrowserVersion)"
        }

        $json | ConvertTo-Json -Depth 10 | Set-Content $filePath -Encoding UTF8
        Write-Host "CI settings injected into appsettings.json successfully."
      env:
        BS_USERNAME: $(Nipts-BrowserStack-Username)
        BS_ACCESSKEY: $(Nipts-BrowserStack-Password)
        MAGIC_PASSWORD: $(PTS-CP-MAGIC-PASSWORD)
      displayName: 'Inject CI settings into appsettings.json'

    - powershell: |
        # Verify no unreplaced tokens remain, then print a redacted copy to logs.
        $content = Get-Content "$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/appsettings.json" | Out-String
        if ($content -match '#\{\{') {
          Write-Error "appsettings.json still contains unreplaced tokens - check the Key Vault task and secret names."
          exit 1
        }
        Write-Host "Token replacement verified - no unreplaced tokens found."

        $sensitiveKeys = @('UserName', 'UserKey', 'Password', 'AccessKey', 'ConnString', 'ConnectionString', 'Secret', 'Token')
        $pattern = '(' + ($sensitiveKeys -join '|') + ')'
        $redacted = $content -replace "(`"[^`"]*$pattern[^`"]*`"\s*:\s*)`"[^`"]*`"", '$1"***REDACTED***"'
        Write-Host $redacted
      displayName: 'Verify and display appsettings.json'

    - powershell: |
        # Verify the BrowserStack credentials themselves are valid by calling the
        # Automate plan API directly. This isolates an auth/credential problem from
        # the rest of the test stack so failures are diagnosed quickly. The username
        # and access key are never written to the log.
        if ([string]::IsNullOrWhiteSpace($env:BS_USERNAME) -or [string]::IsNullOrWhiteSpace($env:BS_ACCESSKEY)) {
          Write-Error "BrowserStack credentials are empty - check the Key Vault secrets 'Nipts-BrowserStack-Username' and 'Nipts-BrowserStack-Password'."
          exit 1
        }

        # Windows PowerShell 5.1 (the self-hosted agent's default shell) negotiates
        # TLS 1.0/1.1 by default, which the BrowserStack API rejects at the handshake.
        # That surfaces as an exception with NO HTTP response, so it must not be
        # mistaken for an auth failure. Force TLS 1.2 before any HTTPS call.
        [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12

        $pair = "$($env:BS_USERNAME):$($env:BS_ACCESSKEY)"
        $b64  = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
        try {
          $resp = Invoke-RestMethod -Uri 'https://api.browserstack.com/automate/plan.json' `
                    -Headers @{ Authorization = "Basic $b64" } -Method Get
          Write-Host "BrowserStack auth OK."
          Write-Host "Parallel sessions running: $($resp.parallel_sessions_running) / max allowed $($resp.parallel_sessions_max_allowed)"
          Write-Host "Queued sessions: $($resp.queued_sessions) / max queued $($resp.parallel_sessions_max_allowed)"
        }
        catch {
          $status = $null
          if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }

          if ($status -eq 401 -or $status -eq 403) {
            Write-Error "BrowserStack credential check failed (HTTP $status). The credentials in Key Vault are invalid or expired."
          }
          elseif ($status) {
            Write-Error "BrowserStack API returned HTTP $status. This is not necessarily a credential problem - check BrowserStack service status. Details: $($_.Exception.Message)"
          }
          else {
            # No HTTP response at all: TLS/DNS/proxy/network problem, NOT the credentials.
            Write-Error "Could not reach the BrowserStack API (no HTTP response - likely TLS, proxy, or network). This is NOT a credential problem. Details: $($_.Exception.Message)"
          }
          exit 1
        }
      env:
        BS_USERNAME: $(Nipts-BrowserStack-Username)
        BS_ACCESSKEY: $(Nipts-BrowserStack-Password)
      displayName: 'Verify BrowserStack credentials'

    # Only the EnvironmentCheck job clears stale sessions. It runs first (Regression
    # depends on it), so at this point no session from THIS pipeline run exists yet -
    # the only running sessions are orphans left behind by earlier/aborted runs whose
    # lingering browser state can make an otherwise-valid sign-in be flagged as failed.
    # NOTE: BrowserStack sessions are account-wide, so this also stops sessions from
    # any OTHER pipeline run that happens to be executing right now. That is acceptable
    # for the environment-check baseline; it is deliberately NOT run for Regression.
    - ${{ if eq(parameters.jobName, 'EnvironmentCheck') }}:
      - powershell: |
          # Terminate any still-running BrowserStack Automate sessions before the
          # environment check so a leftover/authenticated session cannot interfere
          # with the sign-in under test. Failures here must never fail the job - this
          # is best-effort cleanup - so every call is wrapped and errors are warnings.
          # Force TLS 1.2 - Windows PowerShell 5.1 otherwise fails the BrowserStack
          # handshake, which would look like an API error rather than a TLS problem.
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          $pair    = "$($env:BS_USERNAME):$($env:BS_ACCESSKEY)"
          $b64     = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $headers = @{ Authorization = "Basic $b64" }
          $currentBuild = "$(Build)"

          try {
            $builds = Invoke-RestMethod -Uri 'https://api.browserstack.com/automate/builds.json?status=running' -Headers $headers -Method Get
          }
          catch {
            Write-Host "##vso[task.logissue type=warning]Could not list running BrowserStack builds ($($_.Exception.Message)); skipping stale-session cleanup."
            return
          }

          $stopped = 0
          foreach ($b in $builds) {
            $build = $b.automation_build
            if (-not $build) { continue }

            # Never touch this run's own build (it has no sessions yet, but guard anyway).
            if ($build.name -eq $currentBuild) {
              Write-Host "Skipping current build '$($build.name)'."
              continue
            }

            try {
              $sessions = Invoke-RestMethod -Uri "https://api.browserstack.com/automate/builds/$($build.hashed_id)/sessions.json?status=running" -Headers $headers -Method Get
            }
            catch {
              Write-Host "Could not list sessions for build '$($build.name)' ($($_.Exception.Message)); continuing."
              continue
            }

            foreach ($s in $sessions) {
              $session = $s.automation_session
              if (-not $session) { continue }
              try {
                Invoke-RestMethod -Uri "https://api.browserstack.com/automate/sessions/$($session.hashed_id).json" -Headers $headers -Method Delete | Out-Null
                $stopped++
                Write-Host "Stopped stale session $($session.hashed_id) (build '$($build.name)')."
              }
              catch {
                Write-Host "Could not stop session $($session.hashed_id) ($($_.Exception.Message))."
              }
            }
          }

          Write-Host "BrowserStack stale-session cleanup complete. Sessions stopped: $stopped."
        env:
          BS_USERNAME: $(Nipts-BrowserStack-Username)
          BS_ACCESSKEY: $(Nipts-BrowserStack-Password)
        displayName: 'Terminate stale BrowserStack sessions'
        continueOnError: true

    - powershell: |
        # Capacity gate: the PR triggers many test pipelines at once, which together
        # exceed the BrowserStack parallel-session limit and cause sessions to fail
        # to start ("Remote WebDriver not been set properly"). This step throttles
        # globally - every test job funnels through this template, so it waits here
        # until a session slot is free before launching the tests.
        # Force TLS 1.2 so the BrowserStack API call succeeds on Windows PowerShell 5.1.
        [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
        $pair    = "$($env:BS_USERNAME):$($env:BS_ACCESSKEY)"
        $b64     = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
        $headers = @{ Authorization = "Basic $b64" }

        # Random initial jitter (0-45s) so jobs that start together don't poll and
        # claim slots in lockstep.
        Start-Sleep -Seconds (Get-Random -Minimum 0 -Maximum 45)

        $maxWaitMinutes = 40
        $deadline       = (Get-Date).AddMinutes($maxWaitMinutes)

        while ($true) {
          try {
            $plan    = Invoke-RestMethod -Uri 'https://api.browserstack.com/automate/plan.json' -Headers $headers -Method Get
            $running = [int]$plan.parallel_sessions_running
            $max     = [int]$plan.parallel_sessions_max_allowed
          }
          catch {
            Write-Host "Could not query BrowserStack plan ($($_.Exception.Message)); proceeding without gating."
            break
          }

          if ($running -lt $max) {
            Write-Host "Slot available ($running/$max sessions running). Proceeding to tests."
            break
          }

          if ((Get-Date) -ge $deadline) {
            Write-Host "##vso[task.logissue type=warning]Waited $maxWaitMinutes min for a free BrowserStack slot ($running/$max in use). Proceeding anyway."
            break
          }

          $wait = Get-Random -Minimum 20 -Maximum 40
          Write-Host "All $max sessions in use ($running/$max). Waiting $wait s before re-checking..."
          Start-Sleep -Seconds $wait
        }
      env:
        BS_USERNAME: $(Nipts-BrowserStack-Username)
        BS_ACCESSKEY: $(Nipts-BrowserStack-Password)
      displayName: 'Wait for free BrowserStack session slot'

    - powershell: |
        Set-Location -Path "$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests"
        # NUnit.NumberOfTestWorkers is overridden on the command line to cap how many
        # BrowserStack sessions this job opens concurrently, regardless of the value
        # baked into the artifact's runsettings.
        dotnet test "$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/nipts-pts-automation-tests.dll" --settings "$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/testrun.runsettings" --filter "$(Where)" --logger:"trx;logfilename=${{ parameters.jobName }}.xml" -- NUnit.NumberOfTestWorkers=${{ parameters.maxParallelSessions }}
      displayName: 'Execute Tests'
      failOnStderr: true
      ignoreLASTEXITCODE: true
      continueOnError: true
    
    - ${{ if or( eq(parameters.branchName, 'refs/heads/master'), contains(parameters.branchName, 'release'), eq(parameters.branchName, 'dev') ) }}:
      - task: SpecFlowPlus@0
        displayName: 'LivingDoc with FeatureFolder generatorSource'
        inputs:
          generatorSource: 'TestAssembly'
          testAssemblyFilePath: '$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/nipts-pts-automation-tests.dll'
          testExecutionJson: '$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/TestExecution.json'
          projectName: 'nipts-pts-automation-tests'
          projectLanguage: 'en'
          workItemPrefix: 'WI'
        enabled: true
        continueOnError: true
        condition: always()
        timeoutInMinutes: 10
    
    - task: PublishPipelineArtifact@0
      displayName: 'Publish Screenshots'
      inputs:
          testResultsFiles: 'TestFailures*.png'
          artifactName: ${{ parameters.jobName }}
          targetPath: '$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/TestResults/'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: ${{ parameters.jobName }}.xml
        searchFolder: '$(System.DefaultWorkingDirectory)/nipts-pts-automation-tests/TestResults/'
        testRunTitle: ${{ parameters.jobName }}
        failTaskOnFailedTests: true
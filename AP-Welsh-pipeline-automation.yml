trigger:
  branches:
    exclude:
      - '*'

parameters:
  - name: branchName
    type: string
    default: 'refs/heads/dev'
  - name: Environment
    type: string
    default: 'tst'
  - name: ApiEndpoint
    type: string
    default: 'tst'
  - name: SeleniumGrid
    type: string
    default: 'https://hub.browserstack.com/wd/hub/'
  - name: DeviceName
    type: string
    default: 'Windows'
  - name: BSOSVersion
    type: string
    default: '11'
  - name: BSBrowserVersion
    type: string
    default: 'latest'
  - name: Target
    type: string
    default: 'Edge'

schedules:
# 05:00 so the isolated Welsh suite starts after AP-GB regression (02:00), avoiding the shared-data race.
- cron: "0 5 * * Mon,Tue,Wed,Thu,Fri"
  displayName: Daily 05:00 Welsh build
  branches:
    include:
    - dev
    exclude:
    - feature/*
    - task/*
    - master


resources:
  repositories:
    - repository: clientautomationreponew
      type: github
      name: DEFRA/nipts-pts-automation-tests
      ref: $(Build.SourceBranch)
      endpoint: DEFRA

stages:

  - stage: EnvironmentCheck
    displayName: EnvironmentCheck
    jobs:
    - template: run-test-template.yml
      parameters:
        jobName: EnvironmentCheck
        envConfigParam: ${{ parameters.Environment}}
        apiEndPoint: ${{ parameters.ApiEndpoint}}
        branchName: ${{ parameters.branchName}}
        SeleniumGrid: ''
        TestDeviceName: ${{parameters.DeviceName}}
        OSVersionName: ${{parameters.BSOSVersion}}
        BrowserVersionName: ${{parameters.BSBrowserVersion}}
        dependsOn: ''
        targetBrowserName: ${{parameters.Target}}

  - stage: WelshRegression
    displayName: WelshRegression
    jobs:
    - template: run-test-template.yml
      parameters:
        jobName: WelshRegression
        envConfigParam: ${{ parameters.Environment}}
        apiEndPoint: ${{ parameters.ApiEndpoint}}
        branchName: ${{ parameters.branchName}}
        SeleniumGrid: ''
        TestDeviceName: ${{parameters.DeviceName}}
        OSVersionName: ${{parameters.BSOSVersion}}
        BrowserVersionName: ${{parameters.BSBrowserVersion}}
        targetBrowserName: ${{parameters.Target}}
        dependsOn: 'EnvironmentCheck'
